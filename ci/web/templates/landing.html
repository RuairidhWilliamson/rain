<!DOCTYPE html>
<html>

<head>
  <title>Rain CI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
  <title>{% block title %}Rain CI{% endblock %}</title>
</head>

<body>
  <div id="content">
    <h1>Rain CI Landing</h1>

    {% match next %}
    {% when Some with (next) %}
    <a href='/auth?next={{ next }}'>Login</a>
    {% when None %}
    <a href='/auth'>Login</a>
    {% endmatch %}
  </div>
</body>

</html>
