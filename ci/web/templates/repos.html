{% extends "base.html" %}

{% block content %}
<h1>Repos</h1>
{% let paged = paged_repos %}
{% include "page_info.html" %}
<table>
  <tr>
    <th>Repository</th>
  </tr>
  {% for WithId{id, resource: repo} in paged_repos.elements %}
  <tr>
    <td><a href="{{ repo.external_repo_url() }}">{{ repo.owner }}/{{ repo.name }}</a></td>
    <td><a href="/repo/{{id}}">View</a></td>
  </tr>
  {% endfor %}
</table>

{% include "page_buttons.html" %}

{% endblock %}
