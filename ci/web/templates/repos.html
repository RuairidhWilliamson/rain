{% extends "base.html" %}

{% block content %}
<h1>Repos</h1>
{% let paged = paged_repos %}
{% include "page_info.html" %}
<table>
  <tr>
    <th>Host</th>
    <th>Owner</th>
    <th>Name</th>
  </tr>
  {% for (repo_id, repo) in paged_repos.elements %}
  <tr>
    <td>{{ repo.host }}</td>
    <td>{{ repo.owner }}</td>
    <td>{{ repo.name }}</td>
    <td><a href="/repo/{{repo_id}}">View</a></td>
  </tr>
  {% endfor %}
</table>

{% include "page_buttons.html" %}

{% endblock %}
