[workspace]
members = [
  "core",
  "lang",
  "cli",
  "ruipc",
  "poison_panic",
  "rain-lsp",
  "ci/coordinator",
  "ci/web",
  "ci/migrator",
  "ci/common",
  "tree-sitter-rain",
  "fuzz",
]
resolver = "3"

[profile.release]
lto = true
panic = "abort"

[workspace.package]
version = "0.13.1"
edition = "2024"
rust-version = "1.88"
authors = ["Ruairidh Williamson"]
publish = false

[workspace.lints.clippy]
# Cargo
wildcard_dependencies = "warn"

# Restriction
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
exit = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
print_stderr = "warn"
print_stdout = "warn"

# Nursery
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
suboptimal_flops = "allow"
option_if_let_else = "allow"
useless_let_if_seq = "allow"
non_send_fields_in_send_ty = "allow"
cognitive_complexity = "allow"

# Pedantic
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
default_trait_access = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
unnecessary_debug_formatting = "allow"

[workspace.dependencies]
anyhow = "1.0"
base16 = "0.2"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
env_logger = "0.11"
envy = "0.4"
git-lfs-rs = { git = "https://github.com/RuairidhWilliamson/git-lfs-rs.git", default-features = false }
indexmap = { version = "2.8", features = ["serde"] }
insta = { version = "1.39", features = ["colors"], default-features = false }
ipnet = { version = "2.11", features = ["serde"] }
http = "1.0"
libc = "0.2"
log = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
secrecy = { version = "0.10", features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres", "derive", "uuid", "chrono" ] }
tempfile = "3.21"
termcolor = "1.4"
test-log = "0.2"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
ureq = { version = "3.0", features = ["json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "fast-rng", "js", "serde"] }
